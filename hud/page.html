 const pc=x=>Math.max(0,x.hp/x.mhp*100);

 h+='<div class="w" id="field">'+c.map((x,i)=>x.t!=1?'':'<div class="card'+(x.c=='BOSS'?' big':'')+cl(x,i)+'" id="c'+i+'"'+ck(x,i)+'><div class="ic">'+(x.ic||'👾')+'</div><b>'+esc(x.n)+'</b><div class="bar"><i style="width:'+pc(x)+'%"></i></div><div>'+fl(x)+(x.c=='BOSS'?'<small>'+Math.ceil(pc(x))+'%</small>':'')+'</div></div>').join('')+'</div>';

 h+='<div class="w" id="cmd">'+cmd(my,a)+'</div><div class="w" id="log">'+G.map(g=>'<div>'+esc(g)+'</div>').join('')+'</div>';

function tbar(){return B.mo==1?'<div class="tm" id="tm" style="width:'+Math.max(0,1-(Date.now()-tat)/TURN)*100+'%"></div>':''}

 if(ui.m=='s')return '<div class="h">Skills · MP '+a.mp+' / '+a.mmp+' · hover a skill for details</div><div class="btns s4">'+K.map((s,i)=>'<button'+(a.mp<s.cost?' disabled':'')+tipAttr('<b>'+esc(s.n)+'</b><br>'+desc(s.e,s.pw,s.tg,s.cost,s.r))+' onclick="sk('+i+')">'+esc(s.n)+' <small>'+s.cost+'</small></button>').join('')+'<button onclick="back()">◀ Back</button></div>'+tbar();

 return '<div class="h">'+esc(a.n)+' — what will you do?</div><div class="btns"><button class="gold" onclick="atk()">⚔ Attack</button><button onclick="mode(\'s\')">✦ Skills</button><button onclick="mode(\'i\')">🧪 Items</button><button'+tipAttr('<b>Defend</b><br>Halve damage until your next turn and restore 10% of your max MP.')+' onclick="send(\'act|defend\')">🛡 Defend</button><button onclick="send(\'act|flee\')"'+(B.boss?' disabled':'')+'>🏃 Flee</button></div>'+tbar()}
function pops(){if(!prev||!B)return;const pv=prev;prev=null;let hurt=0,healed=0,ko=0;B.c.forEach((x,i)=>{const d=x.hp-pv[i].hp;if(!d)return;if(d<0)hurt++;else healed++;if(x.hp<=0&&pv[i].hp>0)ko++;const e=document.getElementById('c'+i);if(!e)return;const s=document.createElement('div');s.className='pop '+(d<0?'dmg':'heal');s.textContent=(d>0?'+':'')+d;e.appendChild(s);if(d<0)e.classList.add('hit')});if(ko)setTimeout(()=>sfx('ko'),180)}
setInterval(()=>{if(banner&&Date.now()-banner>banLen){banner=0;banLen=5000;XA=null;draw()}const t=$('#tm');if(t)t.style.width=Math.max(0,1-(Date.now()-tat)/TURN)*100+'%'},1000);
// ---------- audio: everything is synthesized, no files ----------
let AC=null,MG=null,SG=null,muted=false,cur=null,step=0,nextT=0,seq=null;
let VOL={m:.8,s:.8};try{muted=localStorage.getItem('bhm')=='1';VOL=Object.assign(VOL,JSON.parse(localStorage.getItem('bhv')||'{}'))}catch(e){}
function tv(u){const m=/#v=([\d.]+)/.exec(u||'');return m?+m[1]:1}
function applyVol(){if(AC&&MG){MG.gain.value=muted?0:.2*VOL.m;SG.gain.value=muted?0:.45*VOL.s}if(AU){AU.muted=muted;AU.volume=Math.min(1,.55*VOL.m*tv(AU.src))}try{localStorage.setItem('bhv',JSON.stringify(VOL));localStorage.setItem('bhm',muted?'1':'0')}catch(e){}$('#snd').textContent=muted?'🔇':'🔊'}
function volBox(){sfx('click');const b=$('#vol');if(b.style.display=='block'){b.style.display='none';return}b.innerHTML='<b>🔊 Sound</b><label>Music <input type=range min=0 max=100 value='+Math.round(VOL.m*100)+' oninput="VOL.m=this.value/100;applyVol()"></label><label>Effects <input type=range min=0 max=100 value='+Math.round(VOL.s*100)+' oninput="VOL.s=this.value/100;applyVol()" onchange="sfx(\'click\')"></label><button onclick="muted=!muted;applyVol();volBox();volBox()">'+(muted?'🔈 Unmute':'🔇 Mute all')+'</button>';b.style.display='block'}
$('#snd').textContent=muted?'🔇':'🔊';if(AU)AU.muted=muted;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();SG=AC.createGain();MG.connect(AC.destination);SG.connect(AC.destination);applyVol()}catch(e){}}if(AC&&AC.state=='suspended')AC.resume();return AC}
function toggleSnd(){muted=!muted;if(AU)AU.muted=muted;try{localStorage.setItem('bhm',muted?'1':'0')}catch(e){}$('#snd').textContent=muted?'🔇':'🔊';if(ac()){MG.gain.value=muted?0:.16;SG.gain.value=muted?0:.35}}
document.addEventListener('pointerdown',()=>{ac();if(AU&&AU.paused)AU.play().catch(()=>{});else if(cur&&!seq)startSeq()},{capture:true});
const hz=m=>440*Math.pow(2,(m-69)/12);
function tone(t,m,d,type,vol,dest,slide){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(hz(m),t);if(slide)o.frequency.exponentialRampToValueAtTime(hz(m+slide),t+d);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(dest);o.start(t);o.stop(t+d+.02)}
let NB=null;function noise(t,d,vol,dest,hp){if(!NB){NB=AC.createBuffer(1,AC.sampleRate*.5,AC.sampleRate);const a=NB.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1}const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=NB;f.type='highpass';f.frequency.value=hp||1000;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f);f.connect(g);g.connect(dest);s.start(t);s.stop(t+d+.02)}
// songs: 16 steps per bar; chords as [bass, triad...]
const SONGS={
 lobby:{bpm:92,lead:'triangle',ch:[[48,60,64,67],[45,57,60,64],[41,57,60,65],[43,55,59,62]],arp:[0,1,2,3,2,1,2,3],mel:[72,0,0,74,76,0,79,0,77,0,76,0,74,0,0,0,69,0,72,0,76,0,74,0,72,0,71,0,67,0,0,0,65,0,69,0,72,0,77,0,76,0,74,0,72,0,0,0,67,0,71,0,74,0,79,0,77,0,74,0,71,0,0,0],dr:0},
 battle:{bpm:148,lead:'square',ch:[[45,57,60,64],[41,57,60,65],[43,55,59,62],[40,56,59,64]],arp:[0,1,2,1,3,1,2,1],mel:[69,0,72,0,76,0,74,72,71,0,72,0,69,0,0,0,65,0,69,0,72,0,77,76,74,0,72,0,74,0,0,0,67,0,71,0,74,0,79,77,76,0,74,0,71,0,0,0,68,0,71,0,76,0,80,0,81,0,0,0,80,0,76,0],dr:1},
 boss:{bpm:166,lead:'sawtooth',ch:[[38,62,65,69],[34,58,62,65],[36,60,64,67],[33,57,61,64]],arp:[0,1,2,3,0,1,2,3],mel:[74,0,74,77,0,74,0,72,74,0,0,69,0,70,0,72,70,0,70,74,0,70,0,69,70,0,0,65,0,67,0,69,72,0,72,76,0,72,0,71,72,0,0,67,0,69,0,71,73,0,76,0,79,0,76,0,73,0,69,0,76,0,73,0],dr:2}};
function music(name){if(name==cur)return;cur=name;seq=null;if(AU){AU.pause();AU=null}if(!name)return;
 const urls=(MU[name]||'').split(' ').filter(x=>x&&!auFail[x]);
 if(urls.length){const u=urls[Math.floor(Math.random()*urls.length)],a=new Audio(u);a.loop=true;AU=a;applyVol();
  a.addEventListener('error',()=>{auFail[u]=1;if(AU===a){AU=null;const n=cur;cur=null;music(n)}});
  const p=a.play();if(p&&p.catch)p.catch(()=>{});return}
 if(AC)startSeq()}
function musicSet(p){const n={lobby:p[1]||'',map:p[2]||'',battle:p[3]||'',boss:p[4]||''};if(JSON.stringify(n)==JSON.stringify(MU))return;MU=n;auFail={};const c=cur;cur=null;music(c)}
function startSeq(){if(!AC||!cur||AU)return;const my={};seq=my;step=0;nextT=AC.currentTime+.08;const loop=()=>{if(seq!==my)return;const S=SONGS[cur]||SONGS.lobby;const sp=60/S.bpm/4;while(nextT<AC.currentTime+.25){play(S,step,nextT,sp);step=(step+1)%64;nextT+=sp}setTimeout(loop,60)};loop()}
function play(S,s,t,sp){const bar=Math.floor(s/16)%4,c=S.ch[bar],b=s%16;
 if(S.mel[s])tone(t,S.mel[s],sp*1.8,S.lead,.22,MG);
 if(s%2==0)tone(t,c[1+S.arp[(s/2)%8]%3]+12,sp*.9,'square',.06,MG);
 if(S.dr==0){if(b%8==0)tone(t,c[0],sp*7,'triangle',.4,MG)}
 else{if(b%4==0||(S.dr==2&&b%2==0))tone(t,c[0]+(b%8==4?12:0),sp*1.6,'triangle',.5,MG);
  if(b%8==0||(S.dr==2&&b==10))tone(t,40,.12,'sine',.9,MG,-20);
  if(b%8==4)noise(t,.12,.5,MG,1500);
  if(b%2==0)noise(t,.03,.18,MG,7000)}}
let remind='';setInterval(()=>{if(!B||B.res||B.mo!=1||sent)return;const a=B.c[B.a];if(a&&a.k==me&&Date.now()-tat>25000&&remind!=tkey){remind=tkey;sfx('turn')}},1000);
function sfx(n){if(!ac()||muted)return;const t=AC.currentTime;const D=SG;
 if(n=='click')tone(t,84,.05,'square',.15,D);
 else if(n=='turn'){[76,81,88,93].forEach((m,i)=>tone(t+i*.08,m,i==3?.35:.1,'square',.45,D));tone(t,64,.4,'triangle',.4,D)}
 else if(n=='slash'){noise(t,.16,.7,D,2500);tone(t,60,.12,'sawtooth',.25,D,-14)}
 else if(n=='hit'){noise(t,.1,.6,D,800);tone(t,45,.12,'square',.3,D,-10)}
 else if(n=='magic'){for(let i=0;i<6;i++)tone(t+i*.04,76+i*3,.14,'sine',.2,D);noise(t+.2,.25,.25,D,4000)}
 else if(n=='heal'){[72,76,79,84].forEach((m,i)=>tone(t+i*.07,m,.3,'triangle',.3,D))}
 else if(n=='buff'){tone(t,67,.25,'square',.18,D,12);tone(t+.1,74,.25,'square',.15,D,12)}
 else if(n=='dice'){for(let i=0;i<5;i++)noise(t+i*.05,.03,.5,D,3000);tone(t+.3,88,.15,'square',.2,D)}
 else if(n=='item'){tone(t,81,.08,'square',.2,D);tone(t+.08,88,.12,'square',.2,D)}
 else if(n=='guard'){tone(t,52,.18,'square',.3,D);noise(t,.08,.4,D,3000)}
 else if(n=='ko'){tone(t,60,.5,'sawtooth',.3,D,-24)}
 else if(n=='boss'){tone(t,38,1.2,'sawtooth',.4,D,-5);tone(t,45,1.2,'sawtooth',.3,D,-5);noise(t,1,.3,D,200)}
 else if(n=='tick'){tone(t,84+Math.floor(Math.random()*3),.04,'square',.08,D)}
 else if(n=='lvl'){[72,76,79,84,88,91,96].forEach((m,i)=>tone(t+i*.07,m,i==6?.7:.12,'square',.28,D));tone(t+.49,60,.7,'triangle',.35,D)}
 else if(n=='win'){[67,72,76,79,0,76,79,84].forEach((m,i)=>m&&tone(t+i*.12,m,i==7?.9:.2,'square',.25,D))}
 else if(n=='lose'){[67,63,60,55].forEach((m,i)=>tone(t+i*.28,m,.5,'triangle',.35,D))}
 else if(n=='ready'){[[67,0],[72,.14],[79,.28]].forEach(([m,d])=>tone(t+d,m,.22,'square',.22,D));[84,88].forEach((m,i)=>tone(t+.48+i*.05,m,.6,'triangle',.25,D))}
 else if(n=='flee'){for(let i=0;i<6;i++)tone(t+i*.05,84-i*4,.06,'square',.15,D)}}

const wait=ms=>new Promise(r=>setTimeout(r,ms));
function cline(t){const p=t.split('|');return p[0]=='C'?{n:p[2],adv:p[3],ic:p[4],d:p[5],st:p[6].split(' '),sk:p[7].split(';').map(x=>x.split('~')),role:p[8]||''}:null}
// the job catalog comes one job at a time (keeps the HUD script's memory small)
async function loadCat(stamp){catLoading=1;try{const n=CN,out=[];for(let i=0;i<n;i++){const r=await fetch('c?i='+i+'&t='+Date.now(),{cache:'no-store'});const c=cline(await r.text());if(c)out[i]=c}
 if(out.filter(x=>x).length){CAT=out;catStamp=stamp;draw()}}catch(e){}catLoading=0}
