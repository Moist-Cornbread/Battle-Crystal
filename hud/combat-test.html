<!doctype html>
<html><head><meta charset="utf-8"><title>Battle Crystal - combat test</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1024px;height:512px;overflow:hidden;background:#0b0f1d;color:#e8ecff;font:14px/1.25 "Trebuchet MS",Verdana,sans-serif;user-select:none}
button{font:inherit;color:#e8ecff;background:#27304f;border:1px solid #5a6aa8;border-radius:6px;padding:7px 12px;cursor:pointer}
button:hover:not(:disabled){background:#3a4676}
button:disabled{opacity:.4;cursor:default}
button.go{background:#2f6b3f;border-color:#7be08f}
button.go:hover:not(:disabled){background:#3d8a52}
button.on{background:#6b5a1f;border-color:#ffd75a}
#app{position:relative;width:1024px;height:512px}
/* ---------- lobby ---------- */
#lobby{position:absolute;inset:0;padding:34px 60px;background:linear-gradient(#1b2547,#0b0f1d)}
#lobby h1{font-size:26px;margin-bottom:4px}
#lobby .sub{color:#9fb0e8;margin-bottom:18px}
#lobby .row{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
#lobby .mem{padding:8px 12px;background:#1e2748;border:1px solid #3d4b86;border-radius:8px;min-width:140px}
#lobby .mem b{display:block}
#lobby .mem small{color:#9fb0e8}
#lobby .flp{margin:10px auto;max-width:520px;padding:10px 14px;background:#1a2342;border:1px solid #3d4b86;border-radius:8px;text-align:left}
#lobby .flp .bar{position:relative;height:16px;margin:3px 0 8px;background:#0e1430;border-radius:4px;overflow:hidden}
#lobby .flp .bar i{display:block;height:100%;background:#4c8bf5}#lobby .flp .bar.mx i{background:#c79a3a}
#lobby .flp .bar span{position:absolute;left:6px;top:0;font-size:11px;line-height:16px;color:#fff}
#lobby .flp .ab{font-size:13px;padding:4px 8px}#lobby .flp .ab.on{border-color:#7be08f}
#lobby .note{color:#ffd75a;margin-top:10px;min-height:20px}
/* ---------- town (step F, Millhaven) ---------- */
#town{position:absolute;inset:0;padding:14px 22px;background:linear-gradient(#2a3556,#0b0f1d)}
#town h1{font-size:22px;display:inline-block;margin-right:14px}
#town .hd{display:flex;align-items:center;gap:10px;margin-bottom:8px}
#town .purse{margin-left:auto;color:#ffd75a;font-weight:bold}
#town .tabs{display:flex;gap:6px;margin-bottom:8px}
#town .tabs button.on{background:#6b5a1f;border-color:#ffd75a}
#town .pane{display:flex;gap:14px;height:366px}
#town .col{flex:1;overflow:hidden}
#town .it{display:flex;align-items:center;gap:8px;padding:6px 8px;margin-bottom:5px;background:#1e2748;border:1px solid #3d4b86;border-radius:8px}
#town .it .tx{flex:1;min-width:0}
#town .it small{color:#9fb0e8;display:block}
#town .it button{padding:5px 10px}
#town .bar{height:10px;background:#0b0f1d;border-radius:5px;margin:3px 0 7px;overflow:hidden}
#town .bar i{display:block;height:100%}
#town .bar.hp i{background:#5fd078}#town .bar.mp i{background:#5aa0ff}#town .bar.pg i{background:#c79a3a}
#town .card{display:inline-block;width:70px;height:98px;line-height:98px;text-align:center;font-size:34px;font-weight:bold;color:#222;background:#f4efe0;border:2px solid #fff;border-radius:8px;margin:4px 8px 4px 0}
#town .card.red{color:#b32}
#town .sub2{color:#9fb0e8;margin:2px 0 6px}
#town input{width:64px;font:inherit;padding:5px;background:#0e1430;color:#e8ecff;border:1px solid #5a6aa8;border-radius:6px}
/* ---------- battle ---------- */
#field{position:absolute;left:0;top:0;width:1024px;height:366px;overflow:hidden;
 background:linear-gradient(#f6d9a0 0,#f0b98a 14%,#9ed08a 14.5%,#6fae6a 40%,#5c9a5a 100%)}
#field:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(100deg,rgba(255,255,255,.05) 0 18px,rgba(0,0,0,.05) 18px 36px);top:14%}
#board{position:absolute;display:grid;gap:2px}
.t{width:54px;height:54px;border-radius:5px;background:rgba(20,40,20,.22);border:1px solid rgba(255,255,255,.12);position:relative}
.t.half{background:rgba(20,40,20,.30)}
.t.rn{background:rgba(255,215,90,.32);border-color:#ffd75a;cursor:pointer}
.t.rn:hover{background:rgba(255,215,90,.55)}
.t.rng{background:rgba(255,106,106,.20);border-color:#ff6a6a}
.t.hit{cursor:pointer}
.t.hit:hover{background:rgba(255,80,80,.55);border-color:#ffb0b0;box-shadow:inset 0 0 0 2px #ffb0b0}
.t.pend{background:rgba(120,200,255,.35);border-color:#9fe;cursor:pointer}
.f{position:absolute;width:54px;height:54px;transition:left .35s,top .35s;text-align:center;pointer-events:none}
.f .ic{font-size:30px;line-height:36px;filter:drop-shadow(0 2px 1px rgba(0,0,0,.55))}
.f .nm{font-size:10px;line-height:11px;text-shadow:0 1px 2px #000;color:#fff;white-space:nowrap;overflow:hidden}
.f .hp{position:absolute;left:6px;right:6px;bottom:0;height:4px;background:#00000066;border-radius:2px}
.f .hp i{display:block;height:100%;background:#7be08f;border-radius:2px}
.f.fl .ic{transform:scaleX(-1)}
.f .fc{position:absolute;width:0;height:0;border:5px solid transparent;opacity:.85}
.f .fc.n{left:22px;top:-6px;border-bottom:6px solid #ffd75a;border-top:0}
.f .fc.s{left:22px;bottom:-7px;border-top:6px solid #ffd75a;border-bottom:0}
.f .fc.e{right:-6px;top:16px;border-left:6px solid #ffd75a;border-right:0}
.f .fc.w{left:-6px;top:16px;border-right:6px solid #ffd75a;border-left:0}
.f.mon .fc.n{border-bottom-color:#ff8a8a}.f.mon .fc.s{border-top-color:#ff8a8a}.f.mon .fc.e{border-left-color:#ff8a8a}.f.mon .fc.w{border-right-color:#ff8a8a}
.fa{position:absolute;width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-size:15px;color:#ffd75a;background:rgba(255,215,90,.18);border:2px solid #ffd75a;border-radius:10px;cursor:pointer;z-index:5}
.fa:hover{background:rgba(255,215,90,.45)}
.f.dead{opacity:.28}
.f.act:after{content:"";position:absolute;left:3px;right:3px;top:0;bottom:0;border:2px solid #ffd75a;border-radius:8px}
.f.me .nm{color:#ffd75a}
.f.tgt{pointer-events:auto;cursor:pointer}
.f.tgt:after{content:"";position:absolute;left:1px;right:1px;top:-1px;bottom:-1px;border:2px solid #ff6a6a;border-radius:8px;background:rgba(255,80,80,.18)}
.f.tgt:hover:after{background:rgba(255,80,80,.4)}
#cmd button.sm{padding:5px 8px;margin:2px;min-width:0}
#afk{position:absolute;left:50%;top:6px;transform:translateX(-50%);z-index:60;display:flex;gap:10px;align-items:center;padding:6px 12px;background:#5a4300;border:2px solid #ffd75a;border-radius:8px;font-weight:bold;white-space:nowrap}
#order{position:absolute;right:8px;top:8px;width:96px;background:#0b0f1dcc;border:1px solid #3d4b86;border-radius:8px;padding:5px}
#order h4{font-size:10px;color:#9fb0e8;font-weight:normal;margin-bottom:3px}
#order div{display:flex;align-items:center;gap:4px;padding:2px 3px;border-radius:4px;font-size:11px;white-space:nowrap;overflow:hidden}
#order div.now{background:#6b5a1f}
#order div.h{color:#bfe8ff}
#log{position:absolute;left:8px;top:8px;width:200px;background:#0b0f1dcc;border:1px solid #3d4b86;border-radius:8px;padding:5px 8px;font-size:12px;min-height:22px}
#log div{margin:1px 0}
#log div:not(:last-child){opacity:.6}
#timer{position:absolute;left:0;right:0;top:366px;height:5px;background:#10162c}
#timer i{display:block;height:100%;width:100%;background:#7be08f}
#bar{position:absolute;left:0;top:371px;width:1024px;height:141px;background:linear-gradient(#161e3b,#0b0f1d);border-top:1px solid #3d4b86;padding:8px 10px}
#cards{position:absolute;left:10px;top:10px;display:flex;gap:6px;width:620px;flex-wrap:wrap}
.card{width:196px;height:56px;background:#1e2748;border:1px solid #3d4b86;border-radius:8px;padding:4px 8px;position:relative}
.card.cur{border-color:#ffd75a;background:#2d2f4a}
.card.me b{color:#ffd75a}
.card.down{opacity:.45}
.pips{position:absolute;right:6px;top:3px;font-size:10px;color:#ffd75a;letter-spacing:1px;white-space:nowrap}.pips span{opacity:.35}.pips b{display:inline!important;color:#cfd8ff;font-size:9px;letter-spacing:0}
.card.pk{cursor:pointer;border-color:#7be08f}
.card b{font-size:12px;display:block;white-space:nowrap;overflow:hidden}
.bar{height:8px;background:#0b0f1d;border-radius:4px;margin-top:3px;position:relative;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px}
.bar.hp i{background:#5fd078}.bar.mp i{background:#5aa0ff}
.bar span{position:absolute;right:3px;top:-2px;font-size:9px;color:#fff;text-shadow:0 1px 1px #000}
#cmd{position:absolute;left:650px;top:8px;width:364px}
#cmd .row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
#cmd button{min-width:84px}
#msg{position:absolute;left:650px;bottom:6px;width:364px;font-size:12px;color:#9fb0e8;min-height:16px}
#over{position:absolute;inset:0;background:#000a;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:44px;gap:12px}
#over small{font-size:15px;color:#cfd8ff}
.hide{display:none!important}
</style></head><body><div id="app"></div>
<script>
// =====================================================================
//  Battle Crystal: COMBAT TEST screen (private test build)
//  Only what the combat + multiplayer test needs: join, Begin Battle, the grid, Move / Attack / Defend / Potion, turn order, 60 s timer.
//  Talks to the Battle HUD script the same way the full screen does: GET s?v=.. for state, POST a for commands.
// =====================================================================
const TC='0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz';
/*TOWN*/const TOWN={"town":"Millhaven","inn":{"free_through_level":4,"per_level":3},"potion":{"item":0,"buy":8,"sell":2,"cap":9},"payout":95,"cards":13,"betPct":10,"minBet":1,"hold":2,"noteGold":18,"gear":[{"id":"w1","n":"Mill Sword","slot":0,"st":[0,0,3,0,0,0,0],"pr":21,"b":"A plain farm blade. Any hero may use it."},{"id":"b1","n":"Farmer's Jerkin","slot":2,"st":[6,0,0,3,0,0,0],"pr":18,"b":"Padded cloth that turns a glancing blow."},{"id":"h1","n":"Straw Cap","slot":1,"st":[0,0,0,2,0,0,0],"pr":9,"b":"Better than nothing. Mostly sun."},{"id":"f1","n":"Field Boots","slot":3,"st":[0,0,0,1,0,1,0],"pr":7,"b":"Mud-proof, mostly."},{"id":"a1","n":"Hearty Bead","slot":4,"st":[12,0,0,0,0,0,0],"pr":40,"b":"A warm little bead on a string."}],"notices":[{"id":"n1","t":"Mole trouble","m":"Mole Patrol","c":3},{"id":"n2","t":"Pipsqueak pests","m":"Pipsqueak","c":3},{"id":"n3","t":"Field sweep","m":"","c":6},{"id":"n4","t":"Mole burrows","m":"Mole Patrol","c":5},{"id":"n5","t":"Pipsqueak nest","m":"Pipsqueak","c":5},{"id":"n6","t":"Clear the fields","m":"","c":10}],"board":3};/*END TOWN*/
let TN=null,town=0,AB=null,ttab='inn',tshop='buy',GQ=['','','',''];
let voteSeen=0,v=-1,sid=0,me='',L=null,P=null,B=null,G=[],ui={m:''},bp='',sent=0,pend=null,queued=null,ackSt='',rfMsg='',rfAt=0,seqAt=0,bsAt=0,tkey='',tat=0,over=null,live=0,note='',joined=0;
const RF={n:'That turn is already over.',g:"That isn't possible right now.",p:'Not enough MP.',q:'Not enough AP for that.',v:"You can't do that from here. Pick a highlighted tile or a target in reach.",u:'Your screen is out of date. Take the HUD off and put it back on.',c:'That needs another turn to recover first.',m:'Not enough Mana.',s:'That chain is longer than you can manage right now.',k:'Not enough scrap for that.',w:'Nothing left to dig here right now (or your scrap is full). The wreckage turns up more every few turns.',x:"You need to be at your Sentry's controls for that (and step off it to dig).",y:'Your Sentry is still standing. Only one at a time.',r:'Out of reach. Pick a highlighted target.'};
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function isMe(k){return !!k&&!!me&&me.indexOf(k)==0}
function fullK(k){if(!k||k.length>=36||!L)return k;const m=L.m.find(x=>x.k.indexOf(k)==0);return m?m.k:k}
// ---------- sending (M2 protocol: every battle command names its turn; the crystal answers every command; lost ones are re-sent) ----------
function tokC(c){return B&&B.tok&&/^act\|/.test(c)&&!/^act\|t\d/.test(c)&&c!='act|vote'?'act|t'+B.tok.bid+'.'+B.tok.turn+'.'+B.tok.sc+'|'+c.slice(4):c}   // live turns: the turn and the step this command is for
function post(t){fetch('a',{method:'POST',body:t}).then(r=>{if(r.ok&&pend&&pend.c==t&&ackSt=='send'){ackSt='hud';draw()}}).catch(()=>{})}
function hud(c){fetch('a',{method:'POST',body:c}).catch(()=>{})}
// Smooth turns (owner, 2026-11-10): your own step shows at once (pr = what it will do: tile / fr / ad / face / end) while the crystal
// confirms it; one more step can be chosen meanwhile and goes out as soon as the first is confirmed. A refusal undoes both on screen.
function send(c,pr){if(pend){if(!queued&&pend.pr&&!pend.pr.end){queued={c,pr,turn:pend.turn};ui={m:''};draw()}return}
 if(queued)return;
 const t=tokC(c);if(t!=c){pend={c:t,pr:pr||null,bid:B.tok.bid,turn:B.tok.turn,sc:B.tok.sc,at:Date.now(),n:0};ackSt='send';rfMsg='';sent=1;ui={m:''};post(t);draw();return}hud(c)}
function bsync(){bsAt=Date.now();hud('bs')}
// a step is done when the crystal's step count passes it (or the turn moved on); a refusal names the turn and step ("<turn>s<step>:<code>")
function flushQ(n){if(!queued||pend)return;if(!n.tok||n.tok.turn!=queued.turn||n.res){queued=null;return}if(n.mo==1){const q=queued;queued=null;send(q.c,q.pr)}}   // the step chosen while the last one was on its way
function ackCheck(n){flushQ(n);if(!pend||!n.tok||n.tok.bid!=pend.bid)return;
 if(n.tok.turn!=pend.turn||n.tok.sc>pend.sc){if(n.tok.turn!=pend.turn)queued=null;pend=null;sent=0;ackSt='';flushQ(n);return}
 const r=n.tok.res.split(':');if(r.length<2||r[0]!=pend.turn+'s'+pend.sc)return;
 if(r[1]=='k'){if(ackSt!='ok'){ackSt='ok';draw()}return}
 pend=null;queued=null;sent=0;ackSt='';rfMsg=RF[r[1]]||'The crystal refused that command.';rfAt=Date.now();ui={m:''};draw()}
setInterval(()=>{const now=Date.now();
 if(pend&&ackSt!='ok'){const e=now-pend.at;if(pend.n<3&&e>=[3000,6000,10000][pend.n]){pend.n++;post(pend.c)}else if(pend.n>=3&&e>=13000&&ackSt!='trouble'){ackSt='trouble';sent=0;pend.pr=null;queued=null;bsync();draw()}}
 if(B&&B.tok&&!B.res&&inBattle()&&now-bsAt>5000&&now-seqAt>((B.mo==1?2:1)*B.tok.dl+5)*1000)bsync();
 else if((!B||B.res)&&L&&L.busy&&L.m.some(x=>isMe(x.k))&&now-bsAt>5000&&now-seqAt>8000)bsync();
 if(rfMsg&&now-rfAt>6000){rfMsg='';draw()}
 if(inBattle()&&B.mo==1&&B.a!=myIdx()&&!voteSeen&&now-tat>15000){voteSeen=1;draw()}
 if(over&&now>over.until){over=null;draw()}
 timerTick()},500);
setInterval(()=>{if(me)hud('hv|1')},60000);setTimeout(()=>{if(me)hud('hv|1')},5000);
// ---------- parsing ----------
let FL=null; // step D: the Freelancer summary from the crystal ("FL~level~xp~need~rank~mxp~mneed~used~max~id:name:cost:equipped;...")
function fl(s){if(!s||s.slice(0,3)!='FL~')return null;const f=s.split('~');return{lv:+f[1],xp:+f[2],need:+f[3],rk:+f[4],mx:+f[5],mneed:+f[6],used:+f[7],max:+f[8],ab:(f[9]||'').split(';').filter(x=>x).map(x=>{const q=x.split(':');return{id:q[0],n:q[1],c:+q[2],eq:q[3]=='1'}}),
 job:f[10]||'',jobs:(f[11]||'').split(';').filter(x=>x).map(x=>{const q=x.split(':');return{id:q[0],n:q[1],rk:+q[2],mx:+q[3],mneed:+q[4]}}),
 acts:(f[12]||'').split(';').filter(x=>x).map(x=>{const q=x.split(':');return{id:q[0],n:q[1],ap:+q[2],mana:+q[3],mp:+q[4],k:q[5]}})}}   // step G: current job, discovered jobs, the current job's known actions (only what the crystal sends: nothing undiscovered appears)
function jobName(c){return c=='Squire'?'Freelancer':c} // legacy starter slot stands in for the Freelancer until the job tree is migrated (step G)
function parse(t){const ln=t.split('\n'),h=ln[0].split('|');v=+h[0];me=h[1]||'';if(h[5])sid=h[5];const ng=[];let same=0;
 for(const l of ln.slice(1)){const p=l.split('|');
  if(p[0]=='L')L={busy:p[1]=='1',max:+p[2],m:p[3]?p[3].split(';').map(x=>{const f=x.split('~');return{k:f[0],n:f[1],lv:f[2],c:f[3],afk:f[7]=='1'}}):[],chk:+p[4]||0,rdy:(p[5]||'').split(',').filter(x=>x),by:p[6]||'',force:p[7]=='1'};
  else if(p[0]=='P'){P={c:p[1]||'',lv:+p[2]||0};FL=fl(p[16])}
  else if(p[0]=='F'&&p[1]=='T')TN=tnParse(p)
  else if(p[0]=='F'&&p[1]=='A')AB={on:p[2]=='1',s:+p[3]||0,st:+p[4]||0,chip:p[5]||'',note:p.slice(6).join('|')}
  else if(p[0]=='Q'&&/^[0-3]$/.test(p[1]||''))GQ[+p[1]]=p[2]||''
  else if(p[0]=='B')nb(p);
  else if(p[0]=='G0')same=1;
  else if(p[0]=='G')ng.push(p.slice(1).join('|'))}
 if(L){L.rdy=L.rdy.map(fullK);L.by=fullK(L.by)}
 if(!same&&ng.length)G=ng.slice(-4);
 draw()}
function nb(p){const c=p[7]?p[7].split(';').map(x=>{const f=x.split('~');return{n:f[0],t:+f[1],k:f[2],hp:+f[3],mhp:+f[4]||1,mp:+f[5],mmp:+f[6]||1,f:f[7]||'',it:(f[8]||'').split('.').map(Number),ic:f[12]||'?'}}):[];
 const vt=(p[8]||'0~1').split('~'),tq=(vt[2]||'').split('.');
 const n={tok:vt[2]?{bid:tq[0],seq:+tq[1],turn:+tq[2],res:tq[3]||'',dl:+tq[4]||0,sc:+tq[5]||0,fr:tq[6]||'',ad:+tq[7]||0,ap:tq[8]!=null?+tq[8]:6,mp:tq[9]!=null?+tq[9]:2,gd:+tq[10]||0}:null,r:+p[1],a:+p[2],mo:+p[3],res:+p[4],c,ord:p[9]!=null&&/^T/.test(p[9])?p[9].slice(1).split(',').filter(x=>x!=='').map(Number):[],g:null};
 for(const q of p.slice(10))if(q[0]=='G'&&q.indexOf(':')>0){const a=q.slice(1).split(':');n.g={w:+a[0][0],arena:a[0][1],t:[...a[1]].map(ch=>TC.indexOf(ch)),f:a[2]||''}}
 if(n.tok&&B&&B.tok&&n.tok.bid==B.tok.bid&&n.tok.seq<B.tok.seq)return;       // a late state never replaces a newer one
 if(n.tok){seqAt=Date.now();if(!B&&!n.res&&n.c.some(x=>isMe(x.k)))bsync()}
 const o=B;B=n;
 if(n.res&&live&&(!o||!o.res)){over={res:n.res,until:Date.now()+7000}}
 if(!n.res){live=1;over=null}
 const k=n.tok?n.tok.bid+'.'+n.tok.turn:n.r+':'+n.a+':'+n.mo;   // one key per turn (a live turn has several steps)
 if(k!=tkey){tkey=k;tat=Date.now();voteSeen=0;sent=0;pend=null;queued=null;ackSt='';ui={m:''}}
 {const a=c[n.a];if(bp!=k&&n.mo==1&&a&&isMe(a.k)&&!n.res){bp=k;beep();hud('hv|t')}}
 ackCheck(n)}
function inBattle(){return !!(B&&!B.res&&B.g&&(!L||L.m.some(x=>isMe(x.k))))}   // (someone voted out of the party goes back to the party screen)
function myIdx(){return B?B.c.findIndex(x=>x.t==0&&isMe(x.k)):-1}
function myTurn(){if(!inBattle()||B.a!=myIdx()||myIdx()<0)return false;if(!sent)return B.mo==1;return !!(pend&&pend.pr&&!pend.pr.end&&!queued)}
function beep(){try{const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=660;g.gain.value=.05;o.start();o.stop(a.currentTime+.12)}catch(e){}}
// ---------- the grid rules (the crystal checks them again; this only decides what to highlight) ----------
const dist=(a,b,w)=>Math.max(Math.abs(a%w-b%w),Math.abs(Math.floor(a/w)-Math.floor(b/w)));
function standing(i){return B.c[i].hp>0}
// moving: up to 2 steps in straight lines only (owner, 2026-11-10: no diagonal moves); through friends, never through enemies
const steps=(a,b,w)=>Math.abs(a%w-b%w)+Math.abs(Math.floor(a/w)-Math.floor(b/w));
function reachable(){const g=B.g,w=g.w,a=myIdx(),from=myTile(),out=[];
 const mp=Math.min(2,st().mp);
 for(let t=0;t<w*6;t++){const d=steps(from,t,w);if(d==0||d>mp)continue;
  if(g.t.some((x,i)=>i!=a&&x==t&&standing(i)))continue;
  if(d==2){let ok=false;for(let m=0;m<w*6&&!ok;m++)if(steps(from,m,w)==1&&steps(m,t,w)==1&&!g.t.some((x,i)=>x==m&&standing(i)&&B.c[i].t!=B.c[a].t))ok=true;if(!ok)continue}
  out.push(t)}
 return out}
function preds(){return [pend&&pend.pr,queued&&queued.pr].filter(x=>x)}
function myTile(){let t=B.g.t[myIdx()];for(const p of preds())if(p.tile!=null)t=p.tile;return t}   // where you stand now, counting a step still on its way
function faceOf(i){let f=B.g.f[i];if(i==myIdx())for(const p of preds())if(p.face)f=p.face;return f&&'nesw'.includes(f)?f:(B.c[i].t?'e':'w')}
// ---------- actions ----------
// A turn is live steps, done the moment you choose them (owner, 2026-11-10, Final Fantasy Tactics style):
// MOVE (tap a yellow tile; Undo move until you act), one ACTION (Attack / Defend / Potion), in either order, then WAIT: pick the way you face.
const POTION_REACH=1,ATTACK_REACH=1,AP_ATK=3,AP_POT=2,AP_GRD=2;        // AP costs: PLACEHOLDERS, must match AP_ATK / AP_POT / AP_GRD in the crystal's Engine (weapons will carry their own AP later)
        // must match POTION_REACH / ATTACK_REACH in the crystal's Battlefield script (attack reach will later depend on the weapon or job)
function st(){const s=Object.assign({sc:0,fr:'',ad:0,ap:6,mp:2,gd:0},B.tok);for(const p of preds()){if(p.fr!=null)s.fr=p.fr;if(p.ad!=null)s.ad=p.ad;if(p.apc)s.ap-=p.apc;if(p.mpc)s.mp-=p.mpc;if(p.gd)s.gd=1}return s}   // what the crystal said, plus your own steps still on their way
function clickTile(t){const S=st();if(!myTurn()||S.mp<1||(ui.m&&ui.m!='face'))return;ui.m='';send('act|mv|'+TC[t],{tile:t,fr:S.fr||TC[myTile()],mpc:steps(myTile(),t,B.g.w),face:stepFace(myTile(),t)})}   // a run of moves: Undo goes back to where the run began
function stepFace(a,b){const w=B.g.w,dx=b%w-a%w,dy=Math.floor(b/w)-Math.floor(a/w);if(!dx&&!dy)return null;return Math.abs(dx)>=Math.abs(dy)?(dx>0?'e':'w'):(dy>0?'s':'n')}
function pickAct(k){const S=st(),c={attack:AP_ATK,potion:AP_POT,defend:AP_GRD}[k];if(!myTurn()||S.ap<c||(k=='defend'&&S.gd))return;
 if(k=='defend')return send('act|defend',{ad:2,apc:AP_GRD,gd:1,fr:''});
 ui.m=ui.m==k?'':k;draw()}
// Attack is always available (owner, 2026-11-10): you attack a TILE in reach - an enemy on it, or empty ground. Not an ally's tile.
function hitOK(t){const w=B.g.w,d=dist(myTile(),t,w),a=myIdx();return d>=1&&d<=ATTACK_REACH&&!B.c.some((e,i)=>i!=a&&e.t==0&&standing(i)&&B.g.t[i]==t)}
function hitTile(t){if(!myTurn()||ui.m!='attack'||!hitOK(t))return;send('act|at|'+TC[t],{ad:1,apc:AP_ATK,fr:'',face:stepFace(myTile(),t)})}
function clickEnemy(i){if(!myTurn()||ui.m!='attack')return;
 if(hitOK(B.g.t[i]))return hitTile(B.g.t[i]);
 rfMsg='Too far away. Pick a red tile.';rfAt=Date.now();draw()}
// Items (owner, 2026-11-10): usable on any standing friend in reach INCLUDING yourself, even at full health. Each item has a reach;
// later items (ethers, herbs, thrown items) use the same rule with their own reach.
function itemOK(i,reach){return B.c[i]&&B.c[i].t==0&&standing(i)&&dist(myTile(),i==myIdx()?myTile():B.g.t[i],B.g.w)<=reach}
function itemTile(t){const i=B.c.findIndex((e,k)=>e.t==0&&standing(k)&&(k==myIdx()?myTile():B.g.t[k])==t);if(i>=0)actPotion(i)}
function actPotion(i){if(!myTurn()||ui.m!='potion'||!itemOK(i,POTION_REACH))return;send('act|item|0|'+i,{ad:1,apc:AP_POT,fr:''})}
// step G: a job's own actions (from the crystal: id, name, AP, Mana, MP, kind s self / a adjacent foe / e foe in reach 3 / l landing tile next to a friend)
function jAct(id){return FL&&FL.acts.find(x=>x.id==id)}
function jOK(x,t){const w=B.g.w,a=myIdx(),me=myTile(),on=B.c.findIndex((e,i)=>standing(i)&&(i==a?me:B.g.t[i])==t);
 if(x.k=='a'||x.k=='e')return on>=0&&B.c[on].t==1&&dist(me,t,w)<=(x.k=='a'?1:3);
 if(x.k=='l')return on<0&&steps(me,t,w)<=4&&B.c.some((e,i)=>i!=a&&e.t==0&&standing(i)&&dist(B.g.t[i],t,w)==1);
 if(x.k=='t')return on<0&&steps(me,t,w)>=1&&steps(me,t,w)<=2;   // a trap on a free tile close by
 if(x.k=='n'||x.k=='f'){if(on<0||B.c[on].t!=1)return false;if(x.k=='f')return steps(me,t,w)<=4;const dx=t%w-me%w,dy=Math.floor(t/w)-Math.floor(me/w);if(dx&&dy)return false;const k=Math.abs(dx+dy),sx=Math.sign(dx),sy=Math.sign(dy);if(k>3)return false;
  for(let s=1;s<k;s++)if(B.c.some((e,i)=>standing(i)&&(i==a?me:B.g.t[i])==me+s*(sx+sy*w)))return false;return true}   // Steampunk: Railshot down a clear row/column (n); Sentry Barrage, foe within 4 steps (f)
 if(x.k=='h')return on<0&&steps(me,t,w)>=1&&steps(me,t,w)<=3;   // Steampunk Pressure Leap: any free tile within 3 steps, over anyone
 if(x.k=='c'){const dx=t%w-me%w,dy=Math.floor(t/w)-Math.floor(me/w);if(dx&&dy)return false;const k=Math.abs(dx+dy),sx=Math.sign(dx),sy=Math.sign(dy);if(!k||k>4)return false;
  for(let s=1;s<k;s++)if(B.c.some((e,i)=>standing(i)&&(i==a?me:B.g.t[i])==me+s*(sx+sy*w)))return false;return on<0||(B.c[on].t==1&&k>=2)}   // Steampunk Cablecaster: reel to a free tile, or yank the first foe 2+ away
 if(x.k=='r')return VS.length>=3&&on>=0&&B.c[on].t==1&&dist(me,t,w)<=1;   // Veyran Arts: a chain of 3+ arrows at a foe next to you
 if(x.k=='g'){if(on<0||B.c[on].t!=1)return false;const dx=t%w-me%w,dy=Math.floor(t/w)-Math.floor(me/w);if(dx&&dy)return false;const k=Math.abs(dx+dy),sx=Math.sign(dx),sy=Math.sign(dy);
  if(k+1>st().mp)return false;for(let s=1;s<k;s++){const o=B.c.findIndex((e,i)=>standing(i)&&(i==a?me:B.g.t[i])==me+s*(sx+sy*w));if(o>=0&&B.c[o].t==0)return false}
  const lx=t%w+sx,ly=Math.floor(t/w)+sy;return lx>=0&&lx<w&&ly>=0&&ly<6&&!B.c.some((e,i)=>standing(i)&&(i==a?me:B.g.t[i])==ly*w+lx)}   // slip through a foe in a straight line
 return false}
function pickJob(id){const x=jAct(id),S=st();if(!x||!myTurn()||S.ap<x.ap||(x.mp&&S.mp<x.mp))return;
 if(x.k=='s')return send('act|jb|'+id+'|-1',{ad:1,apc:x.ap,fr:''});
 VS='';ui.m=ui.m=='j:'+id?'':'j:'+id;draw()}
// step G Veyran: the chain is typed here; it travels inside the tile number (inputs in base 5, U1 D2 L3 R4) as 'va<AP>'
let VS='';const VA={U:'↑',D:'↓',L:'←',R:'→'};
function vySlots(){const lv=FL?FL.lv:1;return 4+(lv>=3)+(lv>=9)+(lv>=19)}
function vyKey(k){if(k=='x')VS=VS.slice(0,-1);else if(VS.length<9)VS+=k;draw()}
function jobTile(t){const id=(ui.m||'').slice(2),x=jAct(id);if(!x||!myTurn()||!jOK(x,t))return;
 if(x.k=='r'){const c=Math.min(VS.length,st().ap);let code=0;for(const k of VS)code=code*5+' UDLR'.indexOf(k);VS='';return send('act|jb|va'+c+'|'+(t+1000*code),{ad:1,apc:c,fr:'',face:stepFace(myTile(),t)})}
 if(x.k=='g'){const w=B.g.w,me=myTile(),dx=t%w-me%w,dy=Math.floor(t/w)-Math.floor(me/w);return send('act|jb|'+id+'|'+t,{ad:1,apc:0,mpc:Math.abs(dx+dy)+1,fr:'',tile:t+Math.sign(dx)+Math.sign(dy)*w})}
 if(x.k=='h'||(x.k=='c'&&!B.c.some((e,i)=>standing(i)&&i!=myIdx()&&B.g.t[i]==t)))return send('act|jb|'+id+'|'+t,{ad:1,apc:x.ap,mpc:x.mp||0,fr:'',tile:t});
 send('act|jb|'+id+'|'+t,x.k=='l'?{ad:1,apc:x.ap,mpc:x.mp,fr:'',tile:t}:{ad:1,apc:x.ap,mpc:x.mp||0,fr:'',face:stepFace(myTile(),t)})}
function undoMove(){const s=st();if(!myTurn()||!s.fr)return;send('act|back',{tile:TC.indexOf(s.fr),fr:'',mpc:-Math.min(2-s.mp,steps(myTile(),TC.indexOf(s.fr),B.g.w))})}   // (the MP shown meanwhile is a guess; the crystal's number replaces it)
function waitMode(){if(!myTurn())return;ui.m=ui.m=='face'?'':'face';draw()}
function face(d){if(!myTurn())return;send('act|wait|'+d,{face:d,end:1})}
function back(){if(ui.m){ui.m='';draw()}}
function cancel(){back()}
// AFK (owner bug report 2026-11-10): after missing two turns the crystal skips you until it hears from you, so the screen offers "I'm back!"
let backAt=0;
function amAfk(){return !!(L&&L.m.some(x=>isMe(x.k)&&x.afk))&&Date.now()-backAt>8000}
function imBack(){backAt=Date.now();hud('act|here');rfMsg="Welcome back. You'll get your next turn.";rfAt=Date.now();draw()}
function afkBar(){return amAfk()?'<div id="afk">💤 You were marked AFK, so the party isn\'t waiting for you. <button class="go" onclick="imBack()">I\'m back!</button></div>':''}
function voteOut(i){const m=L&&L.m.find(x=>x.k.indexOf(B.c[i].k)==0);if(!m)return;hud('vote|'+m.k);rfMsg='Vote sent. The party removes them when most players agree.';rfAt=Date.now();draw()}

 if(!me){app.innerHTML='<div id="lobby"><h1>Battle Crystal</h1><div class="sub">Connecting to the crystal...</div></div>';return}

function lobbyView(){const inP=L&&L.m.some(x=>isMe(x.k)),busy=L&&L.busy;let h='<div id="lobby"><h1>Battle Crystal</h1><div class="sub">Combat test: a quick fight to see how it plays with friends.</div>';
 if(!P||!P.c||P.c!='Squire'){h+='<div>Everyone starts as a Freelancer.</div><div class="row">'+[['Squire','🧭','Freelancer','Adaptable, respected, and free to become anything']].map(j=>'<button style="width:260px;height:76px" onclick="hud(\''+j[0]+'\')"><span style="font-size:26px">'+j[1]+'</span><br><b>'+j[2]+'</b> <small>'+j[3]+'</small></button>').join('')+'</div>'}
 else{h+='<div class="row">'+(L?L.m:[]).map(m=>'<div class="mem"><b>'+(isMe(m.k)?'⭐ ':'')+esc(m.n)+'</b><small>'+esc(jobName(m.c))+(isMe(m.k)&&FL?' · level '+FL.lv:'')+'</small>'+(L.chk&&L.rdy.some(r=>r.indexOf(m.k)==0||m.k.indexOf(r)==0)?'<br><small style="color:#7be08f">ready</small>':'')+'</div>').join('')+'</div><div class="row">';
  if(FL&&!busy)h+=flPanel();
  if(TOWN.town&&!busy&&!L.chk)h+='<button onclick="openTown()">🏘 '+esc(TOWN.town)+'</button>';
  if(!inP)h+=busy?'<button disabled>A fight is in progress. You can join after it.</button>':'<button class="go" onclick="hud(\'Join\')">Join the party</button>';
  else if(busy)h+='<button disabled>The party is fighting...</button>';

  else{const rd=L.rdy.some(r=>isMe(r)||r.indexOf(me.slice(0,8))==0);
   if(!rd)h+='<button class="go" onclick="hud(\'Ready\')">✔ Ready</button>';else h+='<button disabled>Waiting for the others...</button>';
   h+='<button onclick="hud(\'Not Ready\')">Not ready</button>';
   if(L.force&&isMe(L.by))h+='<button onclick="hud(\'Begin Battle\')">Start with whoever is ready</button>'}
  h+='</div>'}
 h+='<div class="note">'+esc(rfMsg||note)+'</div></div>';
 if(over)h+=overHtml();
 $('app').innerHTML=h}
function flPanel(){const x=FL,xp=x.need?Math.round(x.xp*100/x.need):100,mp=x.mneed?Math.round(Math.min(x.mx,x.mneed)*100/x.mneed):100;
 let h='<div class="flp"><div><b>Freelancer</b> · level '+x.lv+(x.need?'':' (max)')+'</div><div class="bar xp"><i style="width:'+xp+'%"></i><span>XP '+x.xp+(x.need?' / '+x.need:'')+'</span></div>'

  +x.ab.map(a=>'<button class="ab'+(a.eq?' on':'')+'" onclick="hud(\''+(a.eq?'un':'eq')+'|'+a.id+'\')">'+esc(a.n)+' <small>'+a.c+' pts '+(a.eq?'· equipped':'')+'</small></button>').join('')+'</div>'
  +(x.jobs.length?'<div style="margin-top:6px">Job</div><div class="row"><button class="ab'+(x.job?'':' on')+'" onclick="hud(\'job|\')">Freelancer</button>'+x.jobs.map(j=>'<button class="ab'+(x.job==j.id?' on':'')+'" onclick="hud(\'job|'+j.id+'\')">'+esc(j.n)+' <small>rank '+j.rk+'</small></button>').join('')+'</div>'
   +x.jobs.filter(j=>j.id==x.job).map(j=>'<div class="bar mx"><i style="width:'+(j.mneed?Math.round(Math.min(j.mx,j.mneed)*100/j.mneed):100)+'%"></i><span>'+esc(j.n)+' rank '+j.rk+': '+(j.mneed?j.mx+' / '+j.mneed:'max')+'</span></div>').join('')
   +(x.acts.length?'<div style="font-size:12px;color:#cfd8ff">Known: '+x.acts.map(a=>esc(a.n)).join(', ')+'</div>':''):'')+'</div>';return h}

// ---------- town (step F): Millhaven. The crystal's Town script answers every command with one F|T message; prices and names come from TOWN (town.json, no secrets) ----------
const STN=['HP','MP','ATK','DEF','MAG','SPD','CRIT'],SLN=['Weapon','Head','Body','Feet','Accessory'];
function tnParse(p){const hd=(p[11]||'').split('~').map(Number),ls=(p[12]||'').split('~').map(Number);
 return{gold:+p[2]||0,pots:+p[3]||0,hp:+p[4],mp:+p[5],lv:+p[6]||1,inn:+p[7]||0,board:(p[8]||'').split(',').filter(x=>x),mine:(p[9]||'').split(',').filter(x=>x).map(x=>{const q=x.split(':');return{id:q[0],n:+q[1]||0}}),done:(p[10]||'').split(',').filter(x=>x),
  hand:p[11]?{c:hd[0],bet:hd[1],ph:hd[2],pl:hd[3]}:null,last:p[12]?{c1:ls[0],c2:ls[1],d:ls[2]}:null,note:p[13]||'',maxbet:+p[14]||1}}

 if(busy&&a.st!=3)return h+'<div class="sub2">The party is in a fight.</div></div>';
 if(!a.on)h+='<button class="go" onclick="hud(\'ab|enter\')">Go down</button>';
 else if(a.st==1)h+='<button class="go" onclick="hud(\'ab|fight\')">⚔ Face them</button><button onclick="hud(\'ab|leave\')">Leave</button>';
